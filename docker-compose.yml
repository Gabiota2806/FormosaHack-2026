services:
  postgres:
    image: postgres:16-alpine
    container_name: formosahack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-formosahack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-formosahack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  auth_service:
    build:
      context: ./backend/auth_service
      dockerfile: Dockerfile
    container_name: formosahack_auth_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-formosahack}
      JWT_SECRET: ${JWT_SECRET:-formosahack_jwt_secret_dev_key_2026_not_for_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  core_service:
    build:
      context: ./backend/core_service
      dockerfile: Dockerfile
    container_name: formosahack_core_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-formosahack}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formosahack_frontend
    restart: unless-stopped
    networks:
      - internal-net

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: formosahack_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - auth_service
      - core_service
      - frontend
    networks:
      - internal-net

volumes:
  postgres_data:
    driver: local

networks:
  internal-net:
    driver: bridge
