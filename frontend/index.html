<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget: en Android el teclado achica la vista y la hoja del chat queda por encima -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>CiberGuardián</title>
    <meta name="description" content="Asistente ciudadano para reconocer estafas digitales y pedir auxilio rápido." />
    <meta name="theme-color" content="#212c37" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CiberGuardián" />
    <script>
      // Modo Protector Mayor: se aplica antes del primer render para no mostrar la versión chica
      // un instante al abrir. Misma clave que src/components/protector/useProtectorMode.ts.
      try {
        if (localStorage.getItem('protector_mode') === 'on') document.documentElement.dataset.protector = 'on';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
