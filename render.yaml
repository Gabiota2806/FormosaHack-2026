services:
  # Microservicio de Autenticación y 2FA
  - type: web
    name: formosahack-auth
    runtime: docker
    dockerfilePath: ./backend/auth_service/Dockerfile
    dockerContext: ./backend/auth_service
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formosahack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # Microservicio Core de Negocio (Repository Pattern)
  - type: web
    name: formosahack-core
    runtime: docker
    dockerfilePath: ./backend/core_service/Dockerfile
    dockerContext: ./backend/core_service
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formosahack-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # Frontend React (Compilación y Hosting Estático CDN)
  - type: static
    name: formosahack-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_AUTH_API_URL
        fromService:
          type: web
          name: formosahack-auth
          property: host
      - key: VITE_CORE_API_URL
        fromService:
          type: web
          name: formosahack-core
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Base de Datos PostgreSQL Gratuita en Render
databases:
  - name: formosahack-db
    databaseName: formosahack
    user: formosa_user
    plan: free
    region: ohio
